name: Continuous Integration (CI)

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-api:
    name: Test & Lint Backend (API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?sslmode=disable
      REDIS_URL: redis://localhost:6379
      FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
      GCLOUD_PROJECT: orcalink-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: apps/api/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations
        run: npx prisma migrate deploy

      - name: Run Linter
        run: yarn lint

      - name: Run Unit Tests
        run: yarn test

      - name: Run E2E Tests
        run: yarn test:e2e

  test-web:
    name: Test & Build Frontend (Web)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Web Application (Typecheck & Compile)
        run: npm run build
