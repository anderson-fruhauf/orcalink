name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # CI gate — wait for tests to pass
  # ──────────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ──────────────────────────────────────────────
  # API + Worker — mesma imagem, SERVICE_ROLE diferente
  # ──────────────────────────────────────────────
  deploy-api:
    name: Deploy API & Worker → Cloud Run
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    env:
      GCP_REGION: us-central1
      API_SERVICE_NAME: orcalink-api
      WORKER_SERVICE_NAME: orcalink-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set and sanitize environment variables
        run: |
          # Sanitize PROJECT_ID in case the GitHub Secret has accidental hidden newlines (\r or \n) or spaces
          CLEAN_PROJECT_ID=$(echo "${{ secrets.GCP_PROJECT_ID }}" | tr -d '\r\n ' | xargs)
          echo "CLEAN_PROJECT_ID=$CLEAN_PROJECT_ID" >> $GITHUB_ENV
          echo "ARTIFACT_REGISTRY=${{ env.GCP_REGION }}-docker.pkg.dev/$CLEAN_PROJECT_ID/orcalink-api" >> $GITHUB_ENV
          echo "RUNTIME_SA=orcalink-api@${CLEAN_PROJECT_ID}.iam.gserviceaccount.com" >> $GITHUB_ENV
          echo "TASKS_INVOKER_SA=orcalink-tasks-invoker@${CLEAN_PROJECT_ID}.iam.gserviceaccount.com" >> $GITHUB_ENV

      - name: Build Docker image
        working-directory: apps/api
        run: |
          docker build \
            -t ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/api:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/api/yarn.lock

      - name: Install dependencies
        working-directory: apps/api
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      # O serviço orcalink-worker deve existir (Terraform). Usamos a URL real
      # como WORKER_URL da API e do próprio worker (OIDC audience / enqueue).
      - name: Resolve worker URL (Cloud Tasks)
        run: |
          WORKER_URL=$(gcloud run services describe ${{ env.WORKER_SERVICE_NAME }} \
            --project="${{ env.CLEAN_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)')
          echo "WORKER_URL=$WORKER_URL" >> $GITHUB_ENV

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy ${{ env.API_SERVICE_NAME }} \
            --image ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.CLEAN_PROJECT_ID }} \
            --port 3333 \
            --allow-unauthenticated \
            --clear-secrets \
            --clear-vpc-connector \
            --service-account="${{ env.RUNTIME_SA }}" \
            --set-env-vars="NODE_ENV=production,DATABASE_URL=${{ secrets.DATABASE_URL }},JWT_SECRET=${{ secrets.JWT_SECRET }},RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }},APP_URL=${{ secrets.APP_URL }},WHATSAPP_ENABLED=${{ secrets.WHATSAPP_ENABLED }},WHATSAPP_CREDENTIALS_ENCRYPTION_KEY=${{ secrets.WHATSAPP_CREDENTIALS_ENCRYPTION_KEY }},WHATSAPP_SEND_THROTTLE_MS=${{ secrets.WHATSAPP_SEND_THROTTLE_MS }},WHATSAPP_CONNECT_TIMEOUT_MS=${{ secrets.WHATSAPP_CONNECT_TIMEOUT_MS }},WHATSAPP_PAIR_TIMEOUT_MS=${{ secrets.WHATSAPP_PAIR_TIMEOUT_MS }},SERVICE_ROLE=api,GCP_PROJECT_ID=${{ env.CLEAN_PROJECT_ID }},GCP_LOCATION=${{ env.GCP_REGION }},WORKER_URL=${{ env.WORKER_URL }},CLOUD_TASKS_INVOKER_SA=${{ env.TASKS_INVOKER_SA }}"

      # Mesma imagem da API; privado (sem --allow-unauthenticated). IAM do
      # invoker (Cloud Tasks / Scheduler) continua no Terraform.
      - name: Deploy Worker to Cloud Run
        run: |
          gcloud run deploy ${{ env.WORKER_SERVICE_NAME }} \
            --image ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.CLEAN_PROJECT_ID }} \
            --port 3333 \
            --no-allow-unauthenticated \
            --ingress=internal \
            --timeout=900 \
            --clear-secrets \
            --clear-vpc-connector \
            --service-account="${{ env.RUNTIME_SA }}" \
            --set-env-vars="NODE_ENV=production,DATABASE_URL=${{ secrets.DATABASE_URL }},JWT_SECRET=${{ secrets.JWT_SECRET }},RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }},APP_URL=${{ secrets.APP_URL }},WHATSAPP_ENABLED=${{ secrets.WHATSAPP_ENABLED }},WHATSAPP_CREDENTIALS_ENCRYPTION_KEY=${{ secrets.WHATSAPP_CREDENTIALS_ENCRYPTION_KEY }},WHATSAPP_SEND_THROTTLE_MS=${{ secrets.WHATSAPP_SEND_THROTTLE_MS }},WHATSAPP_CONNECT_TIMEOUT_MS=${{ secrets.WHATSAPP_CONNECT_TIMEOUT_MS }},WHATSAPP_PAIR_TIMEOUT_MS=${{ secrets.WHATSAPP_PAIR_TIMEOUT_MS }},SERVICE_ROLE=worker,GCP_PROJECT_ID=${{ env.CLEAN_PROJECT_ID }},GCP_LOCATION=${{ env.GCP_REGION }},WORKER_URL=${{ env.WORKER_URL }},CLOUD_TASKS_INVOKER_SA=${{ env.TASKS_INVOKER_SA }}"

      - name: Verify deployment
        run: |
          API_URL=$(gcloud run services describe ${{ env.API_SERVICE_NAME }} \
            --project=${{ env.CLEAN_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          WORKER_URL=$(gcloud run services describe ${{ env.WORKER_SERVICE_NAME }} \
            --project=${{ env.CLEAN_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "✅ API deployed at: $API_URL"
          echo "✅ Worker deployed at: $WORKER_URL"

  # ──────────────────────────────────────────────
  # WEB — Deploy to Firebase Hosting
  # ──────────────────────────────────────────────
  deploy-web:
    name: Deploy Web → Firebase Hosting
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build
        working-directory: apps/web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Sanitize project ID for Firebase
        run: |
          CLEAN_PROJECT_ID=$(echo "${{ secrets.GCP_PROJECT_ID }}" | tr -d '\r\n ' | xargs)
          echo "CLEAN_PROJECT_ID=$CLEAN_PROJECT_ID" >> $GITHUB_ENV

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ env.CLEAN_PROJECT_ID }}
