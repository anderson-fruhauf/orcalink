name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # CI gate — wait for tests to pass
  # ──────────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ──────────────────────────────────────────────
  # API — Build & Deploy to Cloud Run
  # ──────────────────────────────────────────────
  deploy-api:
    name: Deploy API → Cloud Run
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    env:
      GCP_REGION: us-central1
      SERVICE_NAME: orcalink-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set and sanitize environment variables
        run: |
          # Sanitize PROJECT_ID in case the GitHub Secret has accidental hidden newlines (\r or \n) or spaces
          CLEAN_PROJECT_ID=$(echo "${{ secrets.GCP_PROJECT_ID }}" | tr -d '\r\n ' | xargs)
          echo "CLEAN_PROJECT_ID=$CLEAN_PROJECT_ID" >> $GITHUB_ENV
          echo "ARTIFACT_REGISTRY=${{ env.GCP_REGION }}-docker.pkg.dev/$CLEAN_PROJECT_ID/orcalink-api" >> $GITHUB_ENV

      - name: Build Docker image
        working-directory: apps/api
        run: |
          docker build \
            -t ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/api:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/api/yarn.lock

      - name: Install dependencies
        working-directory: apps/api
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.CLEAN_PROJECT_ID }} \
            --port 3333 \
            --allow-unauthenticated \
            --clear-secrets \
            --clear-vpc-connector \
            --set-env-vars="NODE_ENV=production,DATABASE_URL=${{ secrets.DATABASE_URL }},RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }},APP_URL=${{ secrets.APP_URL || format('https://{0}.web.app', secrets.GCP_PROJECT_ID) }},WHATSAPP_ENABLED=${{ secrets.WHATSAPP_ENABLED }},WHATSAPP_CREDENTIALS_ENCRYPTION_KEY=${{ secrets.WHATSAPP_CREDENTIALS_ENCRYPTION_KEY }},WHATSAPP_SEND_THROTTLE_MS=${{ secrets.WHATSAPP_SEND_THROTTLE_MS }},WHATSAPP_CONNECT_TIMEOUT_MS=${{ secrets.WHATSAPP_CONNECT_TIMEOUT_MS }},WHATSAPP_PAIR_TIMEOUT_MS=${{ secrets.WHATSAPP_PAIR_TIMEOUT_MS }}"

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --project=${{ env.CLEAN_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "✅ API deployed at: $SERVICE_URL"

  # ──────────────────────────────────────────────
  # WEB — Deploy to Firebase Hosting
  # ──────────────────────────────────────────────
  deploy-web:
    name: Deploy Web → Firebase Hosting
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build
        working-directory: apps/web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Sanitize project ID for Firebase
        run: |
          CLEAN_PROJECT_ID=$(echo "${{ secrets.GCP_PROJECT_ID }}" | tr -d '\r\n ' | xargs)
          echo "CLEAN_PROJECT_ID=$CLEAN_PROJECT_ID" >> $GITHUB_ENV

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ env.CLEAN_PROJECT_ID }}
