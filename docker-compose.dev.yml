services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orcalink
      POSTGRES_PASSWORD: orcalink_pass
      POSTGRES_DB: orcalink
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcalink"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Emulador do Google Cloud Tasks — substitui o Redis/BullMQ em desenvolvimento.
  # As filas precisam existir na subida: o emulador não cria fila sob demanda.
  cloud-tasks-emulator:
    image: ghcr.io/aertje/cloud-tasks-emulator:latest
    command:
      - -host=0.0.0.0
      - -port=8123
      - -queue=projects/orcalink-dev/locations/us-central1/queues/email-dispatch
      - -queue=projects/orcalink-dev/locations/us-central1/queues/whatsapp-dispatch
      - -queue=projects/orcalink-dev/locations/us-central1/queues/remind-quotation
    ports:
      - "8123:8123"
    # Permite o emulador alcançar a API rodando no host (yarn dev).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "yarn install && npx prisma generate && yarn dev"
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://orcalink:orcalink_pass@postgres:5432/orcalink
      JWT_SECRET: dev-secret-key
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      # Em dev, API e worker rodam no mesmo processo
      SERVICE_ROLE: worker
      GCP_PROJECT_ID: orcalink-dev
      GCP_LOCATION: us-central1
      WORKER_URL: http://api:3333
      CLOUD_TASKS_EMULATOR_HOST: cloud-tasks-emulator:8123
      CLOUD_TASKS_DEV_SECRET: dev-tasks-secret
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      cloud-tasks-emulator:
        condition: service_started

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data_dev:
