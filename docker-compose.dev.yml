services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orcalink
      POSTGRES_PASSWORD: orcalink_pass
      POSTGRES_DB: orcalink
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcalink"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "yarn install && npx prisma generate && yarn dev"
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://orcalink:orcalink_pass@postgres:5432/orcalink
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data_dev:
