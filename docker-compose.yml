services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orcalink
      POSTGRES_PASSWORD: orcalink_pass
      POSTGRES_DB: orcalink
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcalink"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./apps/api
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://orcalink:orcalink_pass@postgres:5432/orcalink
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
